/elevation_mapping_node:
  ros__parameters:

    # ── Sensor Input (uncomment ONE section based on your sensor) ─────────────

    # Option 1 – Intel RealSense D435i (depth camera)
    subscribers:
      realsense_camera:
        topic_name: '/elevationmap_camera_01/elevationmap_camera_01/depth/color/points'
        data_type: pointcloud

    # Option 2 – Unitree L1 LiDAR (real robot)
    # subscribers:
    #   l1_lidar:
    #     topic_name: '/unilidar/cloud'
    #     data_type: pointcloud

    # Option 3 – External point cloud merging package
    # subscribers:
    #   fused_data:
    #     topic_name: '/fused_cloud'
    #     data_type: pointcloud

    # Option 4 – ARCHE GrandTour Dataset (multiple LiDARs)
    # subscribers:
    #   animal_lidar:
    #     topic_name: '/anymal/velodyne/points'
    #     data_type: pointcloud
    #   livox_lidar:
    #     topic_name: '/boxi/livox/points'
    #     data_type: pointcloud
    #   hesai_lidar:
    #     topic_name: '/boxi/hesai/points'
    #     data_type: pointcloud

    # Option 5 – Isaac Sim front RGB-D camera (simulation)
    # subscribers:
    #   isaacsim_camera:
    #     topic_name: '/camera_front_pcl'
    #     data_type: pointcloud

    # ── Map Output Layers ──────────────────────────────────────────────────────
    publishers:
      # elevation_map_raw:
      #   layers: ['elevation', 'traversability', 'variance']
      #   basic_layers: ['elevation']
      #   fps: 5.0
      # elevation_map_filter:
      #   layers: ['min_filter', 'smooth', 'inpaint', 'elevation']
      #   basic_layers: ['min_filter']
      #   fps: 3.0

      # Only 'elevation' is needed: geometric_traversability computes the rest.
      elevation_map_raw:
        layers: ['elevation']
        basic_layers: ['elevation']
        fps: 5.0
